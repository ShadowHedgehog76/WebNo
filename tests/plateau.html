<!DOCTYPE html><html><head><meta charset="utf-8"><title>tests plateau</title>
<style>body{margin:0;background:#0B0C13;color:#DDE3EC;font:12px/1.5 monospace;padding:14px}
iframe{position:absolute;left:-3000px;width:1200px;height:800px;border:0}
.ok{color:#2ED47B}.ko{color:#FF6B62}h3{color:#FFC900;margin:14px 0 4px;font-size:12px}</style>
</head><body><div id="out">…</div><script type="module">
// Les tests du plateau tournent dans un vrai navigateur : la 3D a besoin
// d'un contexte WebGL, qu'aucun simulateur DOM ne fournit.
const out = document.getElementById('out');
let pass = 0, fail = 0;
const L = [];
const dit = (h) => L.push(`<h3>${h}</h3>`);
const ok = (c, l, e = '') => {
  c ? pass++ : fail++;
  L.push(`<div class="${c ? 'ok' : 'ko'}">${c ? '✓' : '✗'} ${l}${!c && e ? ' → ' + e : ''}</div>`);
  out.innerHTML = L.join('');
};
const attends = (ms) => new Promise((r) => setTimeout(r, ms));

const cadre = document.createElement('iframe');
cadre.src = '../index.html';
document.body.appendChild(cadre);
await new Promise((r) => { cadre.onload = r; });
const w = cadre.contentWindow, d = cadre.contentDocument;
const erreurs = [];
w.onerror = (m) => erreurs.push(m);
w.addEventListener('unhandledrejection', (e) => erreurs.push(String(e.reason)));
w.Peer = class {
  constructor(id) { this._h = {}; setTimeout(() => (this._h.open || []).forEach((f) => f(id)), 0); }
  on(e, f) { (this._h[e] = this._h[e] || []).push(f); }
  destroy() {}
};
const $ = (id) => d.getElementById(id);

dit('Une partie démarre');
d.getElementById('input-name').value = 'Test';
$('btn-create').click();
await attends(220);
$('btn-fill-bots').click();
await attends(120);
$('btn-start').click();
await attends(900);
const app = w.__webno, g = app.host.game;
if (app.host.pump) { clearInterval(app.host.pump); app.host.pump = null; }
ok(!!g, 'la partie est en cours');
const sc = w.__scene;
ok(!!sc, 'la scène 3D est montée');
ok(sc && sc.pret, 'et le rendu fonctionne');
ok($('scene3d') && $('no3d').hidden, 'la toile a pris la place du plateau');
ok(!d.querySelector('#hand .card'), 'plus aucune carte dans le DOM');

dit('La table');
sc.finirAnimations();
ok(sc.pioche.children.length > 2, 'la pioche est empilée', String(sc.pioche.children.length));
ok(sc.defausse.children.length >= 1, 'la défausse porte au moins une carte');
ok(sc.dossiers.size === 3, 'trois adversaires sont assis', String(sc.dossiers.size));
ok(sc.anneau.children.length === 8, 'l\'anneau de sens tourne autour');
{
  const places = [...sc.dossiers.values()].map((x) => x.racine.position);
  ok(places.every((p) => p.z < 0.6), 'les adversaires occupent le fond de la table');
  const xs = places.map((p) => p.x).sort((a, b) => a - b);
  ok(xs[xs.length - 1] - xs[0] > 3, 'et se répartissent en largeur', xs.map((v) => v.toFixed(1)).join(', '));
  ok([...sc.dossiers.values()].every((x) => x.etiquette), 'chacun porte sa plaque');
}

dit('Ma main');
{
  g.players[0].hand = [['red','5'],['blue','9'],['green','skip'],['wild','wild4']]
    .map(([c, v], i) => ({ id: 'm' + i, color: c, value: v }));
  g.discard = [{ id: 'top', color: 'red', value: '3' }];
  g.currentColor = 'red';
  g.turnIndex = 0;
  app.host.afterChange();
  await attends(60);
  sc.finirAnimations();
  ok(sc.cartes.size === 4, 'quatre cartes en main dans la scène', String(sc.cartes.size));
  const mains = [...sc.cartes.values()];
  ok(mains.every((m) => m.position.z > 2.5), 'posées devant le joueur');
  ok(mains.every((m) => m.rotation.x > 0), 'inclinées face à la caméra');
  const xs = mains.map((m) => m.position.x);
  ok(new Set(xs.map((v) => v.toFixed(2))).size === 4, 'étalées en éventail, sans se superposer');
  const ys = mains.map((m) => m.position.y);
  ok(Math.max(...ys) - Math.min(...ys) < 0.05,
     'alignées sur l\'horizontale, pas en diagonale',
     (Math.max(...ys) - Math.min(...ys)).toFixed(3));
  const eteintes = mains.filter((m) => m.material[2].color.getHex() !== 0xFFFFFF);
  ok(eteintes.length === 2, 'les deux cartes injouables sont éteintes', String(eteintes.length));
}

dit('Le survol et la tenue des cartes');
{
  const m = [...sc.cartes.values()][2];
  const rotAvant = { x: m.rotation.x, y: m.rotation.y, z: m.rotation.z };
  const yAvant = m.position.y;
  sc._souleve(m, true);
  sc.finirAnimations();
  ok(m.position.y > yAvant + 0.2, 'la carte survolée se soulève',
     `${yAvant.toFixed(2)} → ${m.position.y.toFixed(2)}`);
  ok(Math.abs(m.rotation.x - rotAvant.x) < 0.001
     && Math.abs(m.rotation.z - rotAvant.z) < 0.001, 'et ne pivote pas');
  sc._souleve(m, false);
  sc.finirAnimations();
  ok(Math.abs(m.position.y - yAvant) < 0.01, 'elle retrouve sa place ensuite');

  // aucune carte ne doit s'enfoncer dans le feutre
  let sous = 0;
  for (const d0 of sc.dossiers.values()) {
    for (const c of d0.cartes) {
      const p = c.getWorldPosition(new (c.position.constructor)());
      const bas = p.y - Math.sin(c.rotation.x) * 0.75 * (c.scale.x || 1);
      if (bas < 0) sous++;
    }
  }
  ok(sous === 0, 'aucune carte d\'adversaire ne traverse la table', `${sous} carte(s)`);
}

dit('Poser une carte');
{
  const avant = sc.defausse.children.length;
  const dessus = sc.defausse.children[avant - 1];
  g.handle('p0', { type: 'play', cardId: 'm0' });
  app.host.afterChange();
  await attends(60);
  sc.finirAnimations();
  ok(sc.cartes.size === 3, 'la carte quitte la main', String(sc.cartes.size));
  const neuf = sc.defausse.children[sc.defausse.children.length - 1];
  ok(neuf !== dessus, 'et se retrouve sur la défausse');
  ok(Math.abs(neuf.position.x) < 0.2 && Math.abs(neuf.position.z) < 0.2, 'bien au centre de la pile');
}

dit('La pile de défausse ne se mord pas');
{
  // on enchaîne les poses : la pile doit rester bornée et bien étagée
  let souci = null, hauteurMax = 0;
  for (let tour = 0; tour < 12 && !souci; tour++) {
    g.discard = [{ id: 'dp' + tour, color: 'red', value: String(tour % 10) }];
    g.currentColor = 'red';
    app.host.afterChange();
    await attends(20);
    sc.finirAnimations();

    const pile = sc.defausse.children;
    if (pile.length > 5) souci = `${pile.length} cartes empilées`;
    const ys = pile.map((m) => m.position.y).sort((a, b) => a - b);
    for (let i = 1; i < ys.length; i++) {
      if (ys[i] - ys[i - 1] < 0.02) { souci = `deux cartes à ${ys[i].toFixed(3)}`; break; }
    }
    hauteurMax = Math.max(hauteurMax, ys[ys.length - 1] || 0);
  }
  ok(!souci, 'douze poses d\'affilée sans chevauchement', souci || '');
  ok(sc.defausse.children.length === 5, 'la pile se limite à cinq cartes',
     String(sc.defausse.children.length));
  ok(hauteurMax < 0.30, 'et ne monte jamais en tour', hauteurMax.toFixed(3));
  const dessus = sc.defausse.children[sc.defausse.children.length - 1];
  ok(dessus.userData.cardId === 'dp11', 'la dernière posée est bien au sommet',
     String(dessus.userData.cardId));
}

dit('Piocher');
{
  const avant = sc.cartes.size;
  g.turnIndex = 0;
  g.handle('p0', { type: 'draw' });
  app.host.afterChange();
  await attends(60);
  sc.finirAnimations();
  ok(sc.cartes.size === avant + 1, 'la main s\'agrandit d\'une carte', String(sc.cartes.size));
}

dit('Le paquet Flip');
{
  app.host.settings.pack = 'flip';
  g.settings.pack = 'flip';
  g.side = 'dark';
  app.host.afterChange();
  await attends(60);
  sc.finirAnimations();
  ok(sc.side === 'dark', 'la scène suit le côté sombre');
  ok(sc.pack === 'flip', 'et le paquet en cours');
}

dit('Le repli en deux dimensions');
{
  // un téléphone : la scène en volume laisse la place au document
  const f2 = document.createElement('iframe');
  f2.width = 390; f2.height = 844; f2.src = '../index.html';
  document.body.appendChild(f2);
  await new Promise((r) => { f2.onload = r; });
  const w2 = f2.contentWindow, d2 = f2.contentDocument;
  w2.matchMedia = (m) => (/pointer: coarse|hover: none/.test(m)
    ? { matches: true, addEventListener() {}, removeEventListener() {} }
    : { matches: false, addEventListener() {}, removeEventListener() {} });
  w2.Peer = class { constructor(i) { this._h = {}; setTimeout(() => (this._h.open || []).forEach((f) => f(i)), 0); }
    on(e, f) { (this._h[e] = this._h[e] || []).push(f); } destroy() {} };
  d2.getElementById('input-name').value = 'Tel';
  d2.getElementById('btn-create').click();
  await attends(220);
  d2.getElementById('btn-fill-bots').click();
  await attends(120);
  d2.getElementById('btn-start').click();
  await attends(700);
  const sc2 = w2.__scene;
  ok(sc2 && sc2.constructor.name === 'Plateau2d', 'le téléphone reçoit le plateau sans volume',
     sc2 ? sc2.constructor.name : 'aucun');
  ok(!d2.getElementById('plateau2d').hidden, 'qui est bien affiché');
  ok(d2.getElementById('scene-wrap').hidden, 'et la toile en volume écartée');
  // on impose une main et le tour : sans quoi rien n'est jouable si un bot
  // a la main au moment du contrôle
  const g2 = w2.__webno.host.game;
  if (w2.__webno.host.pump) { clearInterval(w2.__webno.host.pump); w2.__webno.host.pump = null; }
  g2.players[0].hand = [['red', '5'], ['blue', '9'], ['green', 'skip'], ['red', '2'],
    ['yellow', '7'], ['wild', 'wild'], ['blue', '3']]
    .map(([c, v], i) => ({ id: 't2-' + i, color: c, value: v }));
  g2.discard = [{ id: 't2-top', color: 'red', value: '3' }];
  g2.currentColor = 'red';
  g2.turnIndex = 0;
  w2.__webno.host.afterChange();
  await attends(60);

  const attendu = w2.__webno.view.hand.length;
  ok(d2.querySelectorAll('#p2-main .c2').length === attendu,
     `la main montre ses ${attendu} cartes`,
     String(d2.querySelectorAll('#p2-main .c2').length));
  ok(d2.querySelectorAll('#p2-sieges .p2-siege').length === 3, 'les trois adversaires sont là');
  ok(d2.querySelector('#p2-defausse .c2'), 'la défausse montre sa carte');
  ok(d2.querySelectorAll('#p2-main .c2.jouable').length > 0, 'les cartes jouables se distinguent');
  // les cartes portent le même dessin qu'en volume, et le sens s'affiche
  const uneCarte = d2.querySelector('#p2-main .c2');
  ok(/^url\("data:image\/png/.test(uneCarte.style.backgroundImage),
     'chaque carte porte le dessin peint pour la 3D',
     uneCarte.style.backgroundImage.slice(0, 28));
  const dos = d2.querySelector('#p2-dos .c2.verso');
  ok(dos && /^url\("data:image\/png/.test(dos.style.backgroundImage),
     'et la pioche montre son dos, marque comprise');
  ok(d2.querySelectorAll('#p2-sens i').length === 8, 'les flèches de sens font le tour',
     String(d2.querySelectorAll('#p2-sens i').length));
  const larg = uneCarte.getBoundingClientRect().width;
  ok(larg >= 70, 'les cartes sont assez grandes pour le doigt', Math.round(larg) + ' px');
  f2.remove();
}

dit('Rien n\'a cassé');
ok(erreurs.length === 0, 'aucune erreur JavaScript', erreurs.slice(0, 2).join(' | '));

L.push(`<h3>${pass} tests réussis, ${fail} échec(s).</h3>`);
out.innerHTML = L.join('');
document.title = fail ? 'ECHEC:' + fail : 'OK:' + pass;
</script></body></html>
